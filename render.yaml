# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Render detects pnpm from pnpm-lock.yaml and package.json "packageManager".
services:
  - type: web
    name: ovrlk-invoice
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: ALLOW_SIGN_UP
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_CLIENT_ID
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
  # 12:00 UTC is after midnight in every US time zone. Each Business uses its own time zone.
  - type: cron
    name: ovrlk-invoice-recurring
    runtime: node
    schedule: "0 12 * * *"
    buildCommand: pnpm install --frozen-lockfile --prod=false
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm recurring:post
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromService:
          name: ovrlk-invoice
          type: web
          envVarKey: DATABASE_URL
      - key: TURSO_AUTH_TOKEN
        fromService:
          name: ovrlk-invoice
          type: web
          envVarKey: TURSO_AUTH_TOKEN
