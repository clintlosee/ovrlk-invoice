version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        applies-to: version-updates
        patterns:
          - "@aws-sdk/*"
      aws-sdk-security:
        applies-to: security-updates
        patterns:
          - "@aws-sdk/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
